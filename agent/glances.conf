# Glances settings for the dashboard. Copy to hosts/<name>.conf to add service checks for one machine.
[global]
check_update=false

# Service checks ("AMPs"): Glances counts the processes whose name or command line matches `regex`.
# With countmin the dashboard shows a green/red dot; without it, it shows the count (e.g. jobs running).
#
# [amp_web-server]
# enable=true
# regex=\/usr\/sbin\/nginx
# refresh=10
# countmin=1
#
# [amp_ci-jobs]
# enable=true
# regex=Runner\.Worker
# refresh=5
